name: build-customer-apk

on:
  push:
    branches: [main]
    paths:
      - "apps/customer/**"
      - "packages/shared/**"
      - "package.json"
      - ".github/workflows/build-customer-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-customer-${{ hashFiles('apps/customer/**/*.gradle*', 'apps/customer/**/gradle-wrapper.properties') }}
          restore-keys: gradle-customer-
      - name: Install root deps
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Prebuild Android
        working-directory: apps/customer
        run: npx expo prebuild --platform android --no-install
      - name: Force Gradle 8.13 wrapper
        working-directory: apps/customer/android
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' gradle/wrapper/gradle-wrapper.properties
      - name: Build debug APK
        working-directory: apps/customer/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-debug-apk
          path: apps/customer/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error





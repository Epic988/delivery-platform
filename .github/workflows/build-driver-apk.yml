name: build-driver-apk

on:
  push:
    branches: [main]
    paths:
      - "apps/driver/**"
      - "packages/shared/**"
      - "package.json"
      - ".github/workflows/build-driver-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-driver-${{ hashFiles('apps/driver/**/*.gradle*', 'apps/driver/**/gradle-wrapper.properties') }}
          restore-keys: gradle-driver-
      - name: Install root deps
        run: npm install --no-audit --no-fund
      - name: Prebuild Android
        working-directory: apps/driver
        run: npx expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: apps/driver/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-debug-apk
          path: apps/driver/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


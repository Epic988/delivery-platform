services:
  - type: web
    name: delivery-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: https://delivery.epic988.app,https://delivery-admin-rp6u.onrender.com
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
  - type: web
    name: delivery-admin
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev --prefix admin && npm run build --prefix admin
    startCommand: npm run start --prefix admin
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://delivery-api-luar.onrender.com
